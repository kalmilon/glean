[project]
name = "glean"
version = "0.1.0"
description = "Local-first research tool: transcripts + metadata from YouTube, Instagram, Twitch, and X."
readme = "README.md"
requires-python = ">=3.11"
# musl-safe, pure-Python only. Heavy lifting is done by binaries (ffmpeg, yt-dlp,
# whisper.cpp, fluidaudiocli), never Python C-extensions.
dependencies = [
    "yt-dlp>=2026.3.3",
    "requests>=2.32",
    "beautifulsoup4>=4.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
glean = "glean.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glean"]
